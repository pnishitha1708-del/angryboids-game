<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angry Boids — 3D</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --panel:#0a0a0aee; --line:#e63946; --red:#e63946; --yellow:#ffee33; --text:#f2eefc;
    --pixel:'Press Start 2P','Courier New',monospace;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#000; } }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Courier New',monospace; overflow:hidden; position:relative; }
  #stage{position:absolute; inset:0; touch-action:none; cursor:grab;}
  #stage.dragging{cursor:grabbing;}
  .pixel-outline{ text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 10px rgba(255,255,255,.15); }
  h1{position:absolute; top:calc(10px + env(safe-area-inset-top,0px)); left:16px; margin:0;
     font-family:var(--pixel); font-size:clamp(11px,2.4vw,16px); letter-spacing:1px; color:var(--red); z-index:5; pointer-events:none;}
  h1 span{color:#fff;}
  #hud{
    position:absolute; top:calc(46px + env(safe-area-inset-top,0px)); left:16px;
    z-index:5; text-align:left; pointer-events:none; font-family:var(--pixel);
  }
  #optionsRow{display:flex; gap:clamp(10px,3vw,28px); justify-content:flex-start; margin-bottom:10px; min-height:1px;}
  #optionsRow .opt{display:flex; flex-direction:column; align-items:center; pointer-events:auto; cursor:pointer;}
  #optionsRow .opt .oLbl{font-size:clamp(8px,1.4vw,11px); color:#fff;}
  #optionsRow .opt .oVal{font-size:clamp(16px,3.4vw,26px); color:#fff; margin-top:4px;}
  #optionsRow .opt .oVal.picked{color:var(--red);}
  #hud .lbl{font-size:clamp(9px,1.6vw,12px); letter-spacing:2px; color:var(--yellow);}
  #hud .num{
    font-size:clamp(48px,11vw,100px); line-height:1; color:#fff; margin-top:2px;
  }
  #tiredBanner{font-family:var(--pixel); font-size:clamp(9px,1.5vw,12px); color:#bbb; text-align:left; margin-top:6px; min-height:32px; line-height:1.8;}
  #resultOverlay{
    position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); cursor:pointer;
  }
  #resultOverlay.show{display:flex;}
  #resultOverlay .big{
    font-family:var(--pixel); font-size:clamp(20px,5.4vw,52px); color:#fff; text-align:center; padding:0 20px; line-height:1.6;
    animation:pop .35s ease-out;
  }
  #resultOverlay .big.win{color:#4dff88;}
  #resultOverlay .big.lose{color:#fff;}
  #resultOverlay .sub{font-family:var(--pixel); font-size:clamp(9px,1.6vw,12px); color:#888; text-align:center; margin-top:18px; letter-spacing:1px;}
  @keyframes pop{ 0%{transform:scale(.6); opacity:0;} 70%{transform:scale(1.08); opacity:1;} 100%{transform:scale(1);} }
  #panel{
    position:absolute; right:12px; top:calc(12px + env(safe-area-inset-top,0px));
    width:250px; background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:12px; z-index:5; max-height:90vh; overflow:auto;
  }
  label{font-size:10px; color:#ccc; display:flex; justify-content:space-between; margin-top:8px; font-family:var(--pixel); letter-spacing:0; line-height:1.6;}
  input[type=range]{width:100%; accent-color:var(--red);}
  button{
    width:100%; margin-top:10px; background:var(--red); color:#fff; border:none; padding:10px;
    font-family:var(--pixel); letter-spacing:1px; cursor:pointer; font-size:11px;
  }
  button:disabled{opacity:.3; cursor:default;}
  button.alt{background:transparent; border:1px solid #666; color:#999;}
  #status{font-size:9px; min-height:44px; line-height:1.8; margin-top:10px; font-family:var(--pixel); color:#999;}
  footer{position:absolute; bottom:calc(6px + env(safe-area-inset-bottom,0px)); left:16px; font-size:8px; opacity:.4; z-index:5; max-width:55%; pointer-events:none; font-family:var(--pixel);}
</style>
</head>
<body>
<h1>ANGRY <span>BOIDS</span></h1>
<div id="hud">
  <div id="optionsRow"></div>
  <div class="lbl">COLLISION</div>
  <div class="num" id="collisionCount">0</div>
  <div id="tiredBanner"></div>
</div>
<div id="stage"></div>
<div id="resultOverlay">
  <div>
    <div class="big" id="resultBig"></div>
    <div class="sub">tap anywhere to continue</div>
  </div>
</div>
<div id="panel">
  <label>Boid 1 distance <span id="s1v">0.4</span></label>
  <input type="range" id="s1" min="0.1" max="2" step="0.1" value="0.4">
  <label>Boid 2 distance <span id="s2v">0.7</span></label>
  <input type="range" id="s2" min="0.1" max="2" step="0.1" value="0.7">
  <button id="guessBtn">GUESS</button>
  <button id="playBtn" disabled>PLAY</button>
  <button id="resetBtn" class="alt">RESET</button>
  <div id="status">Drag a bird to move it around the box — it stays aimed at the center. Drag empty space to orbit, scroll to zoom.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function assetToGeo(asset){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(b64f32(asset.pos),3));
  geo.setAttribute('color', new THREE.BufferAttribute(b64f32(asset.col),3));
  geo.setIndex(new THREE.BufferAttribute(b64u32(asset.idx),1));
  geo.computeVertexNormals();
  return geo;
}

  inner.scale.setScalar(0.9);
  const outer=new THREE.Group();
  outer.add(inner);
  const hit=new THREE.Mesh(new THREE.SphereGeometry(0.75,8,8), hitMat);
  outer.add(hit);
  outer.userData.hit=hit;
  return outer;
}
function makeRigidGroup(geo, scale){
  const inner=new THREE.Group();
  inner.add(new THREE.Mesh(geo,slingMat));
  inner.rotation.x=-Math.PI/2;
  inner.scale.setScalar(scale);
  const outer=new THREE.Group();
  outer.add(inner);
  return outer;
}
// the two real fork-tip points on the body mesh (measured directly off the uploaded
// .3dm — the 'Object001'/'Object002' end caps where the elastic actually attaches),
// in the body group's local recentered space
const FORK_TIP1_LOCAL=new THREE.Vector3(0.040,-0.396,0.866);
const FORK_TIP2_LOCAL=new THREE.Vector3(0.013,0.381,0.869);
function makeSlingBodyGroup(){
  const inner=new THREE.Group();
  inner.add(new THREE.Mesh(slingBodyGeo,slingMat));
  inner.rotation.x=-Math.PI/2;
  inner.scale.setScalar(0.5);
  const tip1=new THREE.Object3D(); tip1.position.copy(FORK_TIP1_LOCAL); inner.add(tip1);
  const tip2=new THREE.Object3D(); tip2.position.copy(FORK_TIP2_LOCAL); inner.add(tip2);
  const outer=new THREE.Group();
  outer.add(inner);
  outer.userData.tip1=tip1; outer.userData.tip2=tip2;
  return outer;
}
function getForkTips(bodyGroup){
  bodyGroup.updateMatrixWorld(true);
  const v1=new THREE.Vector3(), v2=new THREE.Vector3();
  bodyGroup.userData.tip1.getWorldPosition(v1);
  bodyGroup.userData.tip2.getWorldPosition(v2);
  return [v1,v2];
}
const bird1v=makeBirdGroup(), bird2v=makeBirdGroup();
scene.add(bird1v); scene.add(bird2v);
// the fork/frame (fixed) and the handle+pouch (slides back with slingshotDistance) are
// separate real mesh pieces in the .3dm — the file also bakes a long stretched elastic
// cylinder we don't use; we redraw the elastic live instead, between body and handle.
const slingBody1v=makeSlingBodyGroup(), slingBody2v=makeSlingBodyGroup();
const slingHandle1v=makeRigidGroup(slingHandleGeo,0.5), slingHandle2v=makeRigidGroup(slingHandleGeo,0.5);
scene.add(slingBody1v); scene.add(slingBody2v); scene.add(slingHandle1v); scene.add(slingHandle2v);
const elasticMat=new THREE.LineBasicMaterial({color:0x8a5a2e, linewidth:2});
function makeElastic(){
  const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  return new THREE.Line(geo, elasticMat);
}
// each slingshot gets two bands (a real fork has two arms converging on the pouch)
const elastic1a=makeElastic(), elastic1b=makeElastic(), elastic2a=makeElastic(), elastic2b=makeElastic();
scene.add(elastic1a); scene.add(elastic1b); scene.add(elastic2a); scene.add(elastic2b);
function setElastic(line, a, b){
  const arr=line.geometry.attributes.position.array;
  arr[0]=a.x; arr[1]=a.y; arr[2]=a.z; arr[3]=b.x; arr[4]=b.y; arr[5]=b.z;
  line.geometry.attributes.position.needsUpdate=true;
}

function aimAt(outer, position, target){
  outer.position.copy(position);
  const dir=new THREE.Vector3().subVectors(target,position);
  if(dir.lengthSq()<1e-8) return;
  dir.normalize();
  outer.quaternion.setFromUnitVectors(new THREE.Vector3(-1,0,0), dir);
}

const ripplePool=[];
for(let i=0;i<16;i++){
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.01,0.05,20),
    new THREE.MeshBasicMaterial({color:0xffdd33, transparent:true, opacity:0, side:THREE.DoubleSide}));
  ring.visible=false; scene.add(ring); ripplePool.push({mesh:ring, active:false, r:0});
}
function spawnRipple(pos, normal){
  const rp=ripplePool.find(r=>!r.active) || ripplePool[0];
  rp.active=true; rp.r=0.05; rp.mesh.visible=true; rp.mesh.material.opacity=0.9;
  rp.mesh.position.set(pos.x,pos.y,pos.z);
  rp.mesh.lookAt(pos.x+normal.x, pos.y+normal.y, pos.z+normal.z);
}

/* ================= camera orbit / pan / zoom (hand-rolled, no external controls lib) ================= */
let camTheta=0.7, camPhi=0.5, camRadius=13, autoRotate=true;
const TARGET=new THREE.Vector3(0,0,0);
function applyCamera(){
  camera.position.set(
    TARGET.x+camRadius*Math.cos(camPhi)*Math.cos(camTheta),
    TARGET.y+camRadius*Math.sin(camPhi),
    TARGET.z+camRadius*Math.cos(camPhi)*Math.sin(camTheta)
  );
  camera.lookAt(TARGET);
}
applyCamera();
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= physics — ported 1:1 from the real Boid class ================= */
const K=0.5, ATTR_DIST=1.0, ATTR_WEIGHT=0.75, DAMP=0.75, BIRD_COLLISION_RADIUS=1.0;
const TIRED_SPEED=0.05, TIRED_TICKS=30, MAX_SPEED=K*2.0, MAX_TICKS=20000;
const ANCHOR_DIST=BOUND+1, STRETCH=1.5;
const V=(x,y,z)=>({x,y,z});
const len=v=>Math.hypot(v.x,v.y,v.z);

function dirFromAngles(theta,phi){
  return {x:Math.cos(phi)*Math.cos(theta), y:Math.sin(phi), z:Math.cos(phi)*Math.sin(theta)};
}
// bird1 default aims roughly -X, bird2 roughly +X, with a slight offset so they don't collide dead-on
let theta1=Math.PI-0.35, phi1=0.28, theta2=-0.35, phi2=-0.28;

function makeBoid(pos, maxSpeed){
  return { pos:{...pos}, vel:V(0,0,0), acc:V(0,0,0), maxSpeed,
    launched:false, hasEnteredBox:false, collisionCount:0, isTired:false,
    slowTick:0, pendingVel:V(0,0,0), hasPendingVel:false };
}
function setPendingLaunch(b, v){ b.pendingVel={...v}; b.hasPendingVel=true; }
function attract(a, o){
  const dx=a.pos.x-o.pos.x, dy=a.pos.y-o.pos.y, dz=a.pos.z-o.pos.z;
  const d=Math.hypot(dx,dy,dz);
  if(d>0 && d<ATTR_DIST){
    const inv=ATTR_WEIGHT/d;
    a.acc.x+=dx*inv; a.acc.y+=dy*inv; a.acc.z+=dz*inv;
  }
}
function updateBoid(b, onWallHit){
  if(!b.launched){ b.acc=V(0,0,0); return; }
  if(b.isTired){ b.vel=V(0,0,0); b.acc=V(0,0,0); return; }
  if(b.hasPendingVel){ b.vel={...b.pendingVel}; b.hasPendingVel=false; }
  b.vel.x+=b.acc.x; b.vel.y+=b.acc.y; b.vel.z+=b.acc.z;
  const sp=len(b.vel);
  if(sp>b.maxSpeed){ const s=b.maxSpeed/sp; b.vel.x*=s; b.vel.y*=s; b.vel.z*=s; }
  b.pos.x+=b.vel.x; b.pos.y+=b.vel.y; b.pos.z+=b.vel.z;
  b.acc=V(0,0,0);
  if(!b.hasEnteredBox && Math.abs(b.pos.x)<=BOUND && Math.abs(b.pos.y)<=BOUND && Math.abs(b.pos.z)<=BOUND) b.hasEnteredBox=true;
  if(b.hasEnteredBox){
    if(b.pos.x>BOUND){ b.vel.x*=-1; b.pos.x=BOUND; b.vel.x*=DAMP;b.vel.y*=DAMP;b.vel.z*=DAMP; b.collisionCount++; onWallHit(b,V(1,0,0)); }
    if(b.pos.x<-BOUND){ b.vel.x*=-1; b.pos.x=-BOUND; b.vel.x*=DAMP;b.vel.y*=DAMP;b.vel.z*=DAMP; b.collisionCount++; onWallHit(b,V(-1,0,0)); }
    if(b.pos.y>BOUND){ b.vel.y*=-1; b.pos.y=BOUND; b.vel.x*=DAMP;b.vel.y*=DAMP;b.vel.z*=DAMP; b.collisionCount++; onWallHit(b,V(0,1,0)); }
    if(b.pos.y<-BOUND){ b.vel.y*=-1; b.pos.y=-BOUND; b.vel.x*=DAMP;b.vel.y*=DAMP;b.vel.z*=DAMP; b.collisionCount++; onWallHit(b,V(0,-1,0)); }
    if(b.pos.z>BOUND){ b.vel.z*=-1; b.pos.z=BOUND; b.vel.x*=DAMP;b.vel.y*=DAMP;b.vel.z*=DAMP; b.collisionCount++; onWallHit(b,V(0,0,1)); }
    if(b.pos.z<-BOUND){ b.vel.z*=-1; b.pos.z=-BOUND; b.vel.x*=DAMP;b.vel.y*=DAMP;b.vel.z*=DAMP; b.collisionCount++; onWallHit(b,V(0,0,-1)); }
  }
  if(b.hasEnteredBox){
    if(len(b.vel)<TIRED_SPEED) b.slowTick++; else b.slowTick=0;
    if(b.slowTick>=TIRED_TICKS){ b.isTired=true; b.vel=V(0,0,0); }
  }
}

function bodyPos(theta,phi){
  const d=dirFromAngles(theta,phi);
  return {x:d.x*ANCHOR_DIST, y:d.y*ANCHOR_DIST, z:d.z*ANCHOR_DIST};
}
// handle+pouch sits AT the body when slingshotDistance=0, and slides straight back
// (away from the box) as it increases — the bird rides in the handle
function handlePosFrom(bpos, theta, phi, s){
  const d=dirFromAngles(theta,phi);
  return {x:bpos.x+d.x*STRETCH*s, y:bpos.y+d.y*STRETCH*s, z:bpos.z+d.z*STRETCH*s};
}
function makeSetup(s1,s2){
  const bp1=bodyPos(theta1,phi1), bp2=bodyPos(theta2,phi2);
  const p1=handlePosFrom(bp1,theta1,phi1,s1), p2=handlePosFrom(bp2,theta2,phi2,s2);
  const center=V(0,0,0);
  const dir1v=new THREE.Vector3(center.x-p1.x,center.y-p1.y,center.z-p1.z).normalize();
  const dir2v=new THREE.Vector3(center.x-p2.x,center.y-p2.y,center.z-p2.z).normalize();
  const b1=makeBoid(p1, s1), b2=makeBoid(p2, s2);
  setPendingLaunch(b1, V(dir1v.x*K*s1, dir1v.y*K*s1, dir1v.z*K*s1));
  setPendingLaunch(b2, V(dir2v.x*K*s2, dir2v.y*K*s2, dir2v.z*K*s2));
  return { b1, b2, birdCollision:0, touching:false };
}
function tick(state, onRipple){
  const {b1,b2}=state;
  b1.maxSpeed=MAX_SPEED; b2.maxSpeed=MAX_SPEED;
  attract(b1,b2); attract(b2,b1);
  const dx=b2.pos.x-b1.pos.x, dy=b2.pos.y-b1.pos.y, dz=b2.pos.z-b1.pos.z;
  const dist=Math.hypot(dx,dy,dz);
  if(dist<BIRD_COLLISION_RADIUS){
    if(!state.touching){
      state.birdCollision++;
      const v1={...b1.vel}, v2={...b2.vel};
      b1.vel={x:v2.x*DAMP,y:v2.y*DAMP,z:v2.z*DAMP};
      b2.vel={x:v1.x*DAMP,y:v1.y*DAMP,z:v1.z*DAMP};
      state.touching=true;
      if(onRipple) onRipple(V((b1.pos.x+b2.pos.x)/2,(b1.pos.y+b2.pos.y)/2,(b1.pos.z+b2.pos.z)/2), V(dx/(dist||1),dy/(dist||1),dz/(dist||1)));
    }
  } else state.touching=false;
  updateBoid(b1, onRipple ? (b,n)=>onRipple(b.pos,n) : ()=>{});
  updateBoid(b2, onRipple ? (b,n)=>onRipple(b.pos,n) : ()=>{});
}
function totalCollisions(state){ return state.b1.collisionCount + state.b2.collisionCount + state.birdCollision; }
function precomputeOutcome(s1,s2){
  const state=makeSetup(s1,s2);
  state.b1.launched=true; state.b2.launched=true;
  let ticks=0;
  while(ticks<MAX_TICKS && !(state.b1.isTired && state.b2.isTired)){ tick(state,null); ticks++; }
  return totalCollisions(state);
}

/* ================= option generation — ported 1:1 from Option Shuffle ================= */
function rand1to4(){ return 1+Math.floor(Math.random()*4); }
function rand6to8(){ return 6+Math.floor(Math.random()*3); }
function fisherYates(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function makeOptions(correct){
  const numbers=[correct, Math.round(correct+rand1to4()), Math.round(correct-rand1to4()), Math.round(correct+rand6to8())];
  return fisherYates(numbers);
}

/* ================= game wiring ================= */
let correctAnswer=null, pickedOption=null, gameState=null, animRunning=false;

function syncVisual(state){
  bird1v.position.set(state.b1.pos.x,state.b1.pos.y,state.b1.pos.z);
  bird2v.position.set(state.b2.pos.x,state.b2.pos.y,state.b2.pos.z);
  if(len(state.b1.vel)>0.001){ const d=new THREE.Vector3(state.b1.vel.x,state.b1.vel.y,state.b1.vel.z).normalize();
    bird1v.quaternion.setFromUnitVectors(new THREE.Vector3(-1,0,0), d); }
  if(len(state.b2.vel)>0.001){ const d=new THREE.Vector3(state.b2.vel.x,state.b2.vel.y,state.b2.vel.z).normalize();
    bird2v.quaternion.setFromUnitVectors(new THREE.Vector3(-1,0,0), d); }
}
function updateIdlePositions(){
  const s1=+document.getElementById('s1').value, s2=+document.getElementById('s2').value;
  const bp1=bodyPos(theta1,phi1), bp2=bodyPos(theta2,phi2);
  const hp1=handlePosFrom(bp1,theta1,phi1,s1), hp2=handlePosFrom(bp2,theta2,phi2,s2);
  const center=new THREE.Vector3(0,0,0);
  const bp1v=new THREE.Vector3(bp1.x,bp1.y,bp1.z), bp2v=new THREE.Vector3(bp2.x,bp2.y,bp2.z);
  const hp1v=new THREE.Vector3(hp1.x,hp1.y,hp1.z), hp2v=new THREE.Vector3(hp2.x,hp2.y,hp2.z);
  aimAt(slingBody1v, bp1v, center); aimAt(slingBody2v, bp2v, center);
  aimAt(slingHandle1v, hp1v, center); aimAt(slingHandle2v, hp2v, center);
  aimAt(bird1v, hp1v, center); aimAt(bird2v, hp2v, center);
  const [t1a,t1b]=getForkTips(slingBody1v), [t2a,t2b]=getForkTips(slingBody2v);
  setElastic(elastic1a, t1a, hp1); setElastic(elastic1b, t1b, hp1);
  setElastic(elastic2a, t2a, hp2); setElastic(elastic2b, t2b, hp2);
}
document.getElementById('s1').addEventListener('input',e=>{document.getElementById('s1v').textContent=e.target.value; if(!animRunning) updateIdlePositions();});
document.getElementById('s2').addEventListener('input',e=>{document.getElementById('s2v').textContent=e.target.value; if(!animRunning) updateIdlePositions();});

document.getElementById('guessBtn').addEventListener('click',()=>{
  const s1=+document.getElementById('s1').value, s2=+document.getElementById('s2').value;
  correctAnswer=precomputeOutcome(s1,s2);
  const opts=makeOptions(correctAnswer);
  const row=document.getElementById('optionsRow'); row.innerHTML='';
  opts.forEach((v,i)=>{
    const wrap=document.createElement('div'); wrap.className='opt';
    const lbl=document.createElement('div'); lbl.className='oLbl'; lbl.textContent='Option '+(i+1);
    const val=document.createElement('div'); val.className='oVal'; val.textContent=v;
    wrap.appendChild(lbl); wrap.appendChild(val);
    wrap.addEventListener('click',()=>{
      row.querySelectorAll('.oVal').forEach(o=>o.classList.remove('picked'));
      val.classList.add('picked'); pickedOption=v;
      document.getElementById('playBtn').disabled=false;
    });
    row.appendChild(wrap);
  });
  document.getElementById('status').textContent='Pick your predicted collision count, then hit PLAY.';
  hideOverlay();
});

document.getElementById('playBtn').addEventListener('click',()=>{
  if(pickedOption===null) return;
  const s1=+document.getElementById('s1').value, s2=+document.getElementById('s2').value;
  gameState=makeSetup(s1,s2);
  gameState.b1.launched=true; gameState.b2.launched=true;
  animRunning=true;
  // release: handle snaps back to the fixed body, elastic collapses
  const bp1=bodyPos(theta1,phi1), bp2=bodyPos(theta2,phi2);
  const center=new THREE.Vector3(0,0,0);
  aimAt(slingHandle1v, new THREE.Vector3(bp1.x,bp1.y,bp1.z), center);
  aimAt(slingHandle2v, new THREE.Vector3(bp2.x,bp2.y,bp2.z), center);
  const [t1a,t1b]=getForkTips(slingBody1v), [t2a,t2b]=getForkTips(slingBody2v);
  setElastic(elastic1a, t1a, bp1); setElastic(elastic1b, t1b, bp1);
  setElastic(elastic2a, t2a, bp2); setElastic(elastic2b, t2b, bp2);
  document.getElementById('playBtn').disabled=true;
  document.getElementById('guessBtn').disabled=true;
  document.getElementById('collisionCount').textContent='0';
  hideOverlay();
});

function hideOverlay(){
  document.getElementById('resultOverlay').classList.remove('show');
}
document.getElementById('resultOverlay').addEventListener('click', hideOverlay);

document.getElementById('resetBtn').addEventListener('click',()=>{
  animRunning=false; pickedOption=null; correctAnswer=null;
  document.getElementById('optionsRow').innerHTML='';
  document.getElementById('playBtn').disabled=true;
  document.getElementById('guessBtn').disabled=false;
  document.getElementById('collisionCount').textContent='0';
  document.getElementById('tiredBanner').textContent='';
  hideOverlay();
  document.getElementById('status').textContent='Drag a bird to reposition it around the box — it stays aimed at the center. Drag empty space to orbit the camera, scroll to zoom.';
  updateIdlePositions();
});

updateIdlePositions();

/* ================= pointer interaction: drag a bird, or orbit the camera ================= */
const raycaster=new THREE.Raycaster();
let dragMode=null, lastX=0, lastY=0;
function ndcFromEvent(e){
  const r=renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
}
stage.addEventListener('pointerdown',e=>{
  autoRotate=false;
  if(!animRunning){
    raycaster.setFromCamera(ndcFromEvent(e), camera);
    const hits=raycaster.intersectObjects([bird1v.userData.hit, bird2v.userData.hit]);
    if(hits.length){
      dragMode = hits[0].object===bird1v.userData.hit ? 'bird1' : 'bird2';
    } else dragMode='camera';
  } else dragMode='camera';
  lastX=e.clientX; lastY=e.clientY;
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!dragMode) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  const sens=0.006;
  if(dragMode==='camera'){
    camTheta-=dx*sens;
    camPhi=Math.max(-1.4,Math.min(1.4, camPhi+dy*sens));
    applyCamera();
  } else if(dragMode==='bird1'){
    theta1-=dx*sens; phi1=Math.max(-1.3,Math.min(1.3, phi1-dy*sens));
    updateIdlePositions();
  } else if(dragMode==='bird2'){
    theta2-=dx*sens; phi2=Math.max(-1.3,Math.min(1.3, phi2-dy*sens));
    updateIdlePositions();
  }
});
window.addEventListener('pointerup',()=>{ dragMode=null; stage.classList.remove('dragging'); });
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  camRadius=Math.max(6,Math.min(22, camRadius+e.deltaY*0.01));
  applyCamera();
},{passive:false});

/* ================= render loop ================= */
function animate(){
  requestAnimationFrame(animate);
  if(animRunning){
    tick(gameState, spawnRipple);
    document.getElementById('collisionCount').textContent=totalCollisions(gameState);
    syncVisual(gameState);
    let tiredMsg='';
    if(gameState.b1.isTired) tiredMsg+='AngryBird 1 is tired !<br>';
    if(gameState.b2.isTired) tiredMsg+='AngryBird 2 is tired !';
    document.getElementById('tiredBanner').innerHTML=tiredMsg;
    if(gameState.b1.isTired && gameState.b2.isTired){
      animRunning=false;
      const finalCount=totalCollisions(gameState);
      const won=(finalCount===pickedOption);
      const big=document.getElementById('resultBig');
      big.textContent=won ? 'You Won' : 'Oh No! Better luck next time';
      big.className='big '+(won?'win':'lose');
      document.getElementById('resultOverlay').classList.add('show');
      document.getElementById('guessBtn').disabled=false;
      document.getElementById('status').textContent='Adjust the setup and try again.';
    }
  }
  ripplePool.forEach(rp=>{
    if(!rp.active) return;
    rp.r+=0.045; rp.mesh.geometry.dispose(); rp.mesh.geometry=new THREE.RingGeometry(rp.r,rp.r+0.03,20);
    rp.mesh.material.opacity-=0.03;
    if(rp.mesh.material.opacity<=0){ rp.active=false; rp.mesh.visible=false; }
  });
  if(autoRotate){ camTheta+=0.0025; applyCamera(); }
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
